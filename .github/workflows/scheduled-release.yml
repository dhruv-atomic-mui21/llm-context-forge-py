name: Scheduled Release System

on:
  schedule:
    # Runs at 00:00 UTC on the 1st day of every month
    - cron: '0 0 1 * *'
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Release type (patch, minor, major)'
        required: true
        default: 'patch'

permissions:
  contents: write
  packages: write

jobs:
  scheduled-release:
    name: Check Pricing & Automated Release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" build twine

      - name: Update Remote Pricing Registry Cache
        run: |
          python -c "
          from llm_context_forge.pricing_provider import update_pricing_registry
          update_pricing_registry()
          print('Remote pricing registry updated successfully.')
          "

      - name: Bump Version & Update Documentation / Changelog Automatically
        run: |
          RELEASE_TYPE="${{ github.event.inputs.release_type || 'patch' }}"
          python scripts/bump_release_version.py "$RELEASE_TYPE"

      - name: Run Full Test Suite
        run: |
          pytest -v

      - name: Commit Automated Release Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml src/llm_context_forge/__init__.py README.md CHANGELOG.md
          git commit -m "chore(release): automated monthly release version bump [skip ci]" || echo "No changes to commit"
          git push origin main || true

      - name: Build Package Artifacts
        run: |
          python -m build

      - name: Create Scheduled GitHub Tag & Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(python -c "import llm_context_forge; print(llm_context_forge.__version__)")
          TAG_NAME="v${VERSION}"
          
          # Check if tag already exists
          if git rev-parse "$TAG_NAME" >/dev/null 2>&1; then
            echo "Tag $TAG_NAME already exists for version $VERSION."
          else
            echo "Creating new release for $TAG_NAME"
            git tag -a "$TAG_NAME" -m "Automated scheduled release $TAG_NAME"
            git push origin "$TAG_NAME" || true
          fi
